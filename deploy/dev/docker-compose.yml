version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${DB_USER:-dev_postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-dev_postgres_pass}
      POSTGRES_DB: ${DB_NAME:-om_messenger}
    ports:
      - target: 5432
        published: 5432
        protocol: tcp
        mode: ingress
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - om-backend-net
    deploy:
      replicas: 1

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-dev_minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-dev_minio_pass_123}
      MINIO_BROWSER: "on"
    ports:
      - target: 9000
        published: 9000
        protocol: tcp
        mode: ingress
      - target: 9001
        published: 9001
        protocol: tcp
        mode: ingress
    volumes:
      - minio_data:/data
    networks:
      - om-backend-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      replicas: 1

  redis:
    image: valkey/valkey:8.1-alpine
    ports:
      - target: 6379
        published: 6379
        protocol: tcp
        mode: ingress
    volumes:
      - redis_data:/data
    networks:
      - om-backend-net
    deploy:
      replicas: 1

  backend:
    image: om-backend-dev:latest
    environment:
      PORT: 8080
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-dev_postgres}
      DB_PASSWORD: ${DB_PASSWORD:-dev_postgres_pass}
      DB_NAME: ${DB_NAME:-om_messenger}
      DB_SSLMODE: disable
      JWT_SECRET: ${JWT_SECRET:-dev_secret}
      
      PUBLIC_API_BASE_URL: ${PUBLIC_API_BASE_URL:-http://localhost:8080/api}
      S3_ENDPOINT: minio:9000
      S3_USE_SSL: "false"
      S3_BUCKET: ${MINIO_BUCKET_NAME:-om-avatars}
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-dev_minio}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-dev_minio_pass_123}
      
      REDIS_ADDR: redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      REDIS_DB: 0
    ports:
      - target: 8080
        published: 8082
        protocol: tcp
        mode: ingress
    depends_on:
      - postgres
      - minio
      - redis
    networks:
      - om-backend-net
    deploy:
      replicas: 1

volumes:
  postgres_data:
  minio_data:
  redis_data:

networks:
  om-backend-net:
    driver: overlay
